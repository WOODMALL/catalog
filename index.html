<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우드몰 웹 카탈로그</title>
  <!-- Flipbook 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    body {
      margin: 0;
      background: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .flip-book {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none; /* 로딩 전 숨김 */
    }
    .page {
      background-color: #fff;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="book" class="flip-book">
    <!-- 표지 및 내지 이미지 -->
    <div class="page"><img src="https://ecimg.cafe24img.com/pg1512b25903205017/woodmallcokr/web/catalog/1P.jpg" alt="표지"></div>
    <div class="page"><img src="https://ecimg.cafe24img.com/pg1512b25903205017/woodmallcokr/web/catalog/2P.jpg" alt="1페이지"></div>
    <div class="page"><img src="https://ecimg.cafe24img.com/pg1512b25903205017/woodmallcokr/web/catalog/3P.jpg" alt="2페이지"></div>
    <div class="page"><img src="https://picsum.photos/id/1019/600/800" alt="3페이지"></div>
    <div class="page"><img src="https://picsum.photos/id/1020/600/800" alt="뒤표지"></div>
  </div>

  <div class="controls">
    <button onclick="flipBook.flipPrev()">이전 페이지</button>
    <button onclick="flipBook.flipNext()">다음 페이지</button>
  </div>

  <script>
    let flipBook;
    window.addEventListener('DOMContentLoaded', () => {
      const bookElem = document.getElementById('book');
      bookElem.style.display = 'block';

      flipBook = new St.PageFlip(bookElem, {
        width: 400,        // 기본 페이지 가로(px)
        height: 550,       // 기본 페이지 세로(px)
        size: "stretch",
        minWidth: 315,
        maxWidth: 1000,
        minHeight: 420,
        maxHeight: 1350,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false
      });

      flipBook.loadFromHTML(document.querySelectorAll('.page'));
    });
  </script>
</body>
</html>
