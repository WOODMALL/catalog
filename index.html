<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>우드몰 e-Catalog</title>
  <!-- Page-Flip 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #1a1a1a;
      height: 100vh;
      height: 100dvh; /* 모바일 주소창 변화 대응 */
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* [PC 기본] 요청하신 67% 적당한 크기 유지 */
    .catalog-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 67vh;
      max-width: 88vw;
      margin-bottom: 30px;
      touch-action: none;
    }

    /* 핀치 줌 전용 뷰포트 레이어 */
    #zoom-viewport {
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
      width: 100%;
      height: 100%;
    }

    #book {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    /* 화면 최하단 고정 조작 바 */
    .toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    .page-info {
      color: #eee;
      font-size: 0.85rem;
      min-width: 60px;
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* ========================================================
     * [모바일 전용 최적화] 스마트폰 화면을 꽉 채우도록 설정
     * ======================================================== */
    @media (max-width: 768px) {
      .catalog-wrapper {
        /* 하단 툴바(약 60px)만 남겨두고 화면 전체를 카탈로그로 꽉 채움 */
        height: calc(100dvh - 70px);
        height: calc(100vh - 70px);
        width: 98vw;
        max-width: 98vw;
        margin-bottom: 55px;
        padding: 0;
      }

      #book {
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      }

      .toolbar {
        bottom: 10px;
        padding: 6px 12px;
        gap: 6px;
      }

      .btn {
        padding: 5px 8px;
        font-size: 0.75rem;
      }

      .page-info {
        font-size: 0.78rem;
        min-width: 50px;
      }
    }
  </style>
</head>
<body>

  <!-- 카탈로그 래퍼 -->
  <div class="catalog-wrapper" id="wrapper">
    <div id="zoom-viewport">
      <div id="book"></div>
    </div>
  </div>

  <!-- 화면 최하단 고정 조작 바 -->
  <div class="toolbar">
    <button class="btn" id="prev-btn">이전</button>
    <span class="page-info" id="page-num">- / -</span>
    <button class="btn" id="next-btn">다음</button>
    <button class="btn" id="reset-zoom-btn">100%</button>
    <button class="btn" id="fullscreen-btn">전체화면</button>
  </div>

  <script>
    // ⚙️ [설정] 실제 전체 페이지 수
    const totalPages = 16; 

    // 이미지 경로 배열 생성
    const imageList = [];
    for (let i = 1; i <= totalPages; i++) {
      const formattedNum = String(i).padStart(2, '0');
      imageList.push(`pages/page-${formattedNum}.jpg`);
    }

    const book = document.getElementById('book');
    const zoomViewport = document.getElementById('zoom-viewport');
    const wrapper = document.getElementById('wrapper');
    const pageNumDisplay = document.getElementById('page-num');

    // 모바일 여부 판단 (768px 이하)
    const isMobile = window.innerWidth <= 768;

    // PageFlip 인스턴스 초기화
    const pageFlip = new St.PageFlip(book, {
      // 모바일에서는 화면 폭에 맞춰 시원하게 커지도록 비율 및 최대치 확장
      width: isMobile ? 420 : 370,
      height: isMobile ? 594 : 520,
      size: 'stretch',
      minWidth: isMobile ? 240 : 200,
      maxWidth: isMobile ? 850 : 600,   // 모바일 화면 폭을 가득 채우도록 허용
      minHeight: isMobile ? 340 : 280,
      maxHeight: isMobile ? 1200 : 800, // 모바일 높이에 맞춰 큼직하게 렌더링
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: false,
      usePortrait: true                  // 스마트폰 세로 화면에서는 1장(단면) 꽉 찬 화면으로 표시
    });

    pageFlip.loadFromImages(imageList);

    function updatePageIndicator() {
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      pageNumDisplay.textContent = `${current} / ${total}`;
    }

    pageFlip.on('init', updatePageIndicator);
    pageFlip.on('flip', updatePageIndicator);

    document.getElementById('prev-btn').addEventListener('click', () => {
      resetZoom();
      pageFlip.flipPrev();
    });
    
    document.getElementById('next-btn').addEventListener('click', () => {
      resetZoom();
      pageFlip.flipNext();
    });

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    window.addEventListener('keydown', (e) => {
      if (scale === 1) {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      }
    });

    /* ========================================================
     * 모바일 핀치 줌(Pinch Zoom), 드래그(Pan), 더블탭 제스처 엔진
     * ======================================================== */
    let scale = 1;
    let posX = 0;
    let posY = 0;
    let startDistance = 0;
    let startScale = 1;
    let startTouchX = 0;
    let startTouchY = 0;
    let isDragging = false;
    let lastTapTime = 0;

    function applyTransform(withTransition = false) {
      zoomViewport.style.transition = withTransition ? 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
      zoomViewport.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      posX = 0;
      posY = 0;
      applyTransform(true);
    }

    document.getElementById('reset-zoom-btn').addEventListener('click', resetZoom);

    function getDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    wrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        e.stopPropagation();
        startDistance = getDistance(e.touches[0], e.touches[1]);
        startScale = scale;
      } 
      else if (e.touches.length === 1) {
        const now = Date.now();
        const touch = e.touches[0];

        // 더블 탭: 2.2배 확대 토글
        if (now - lastTapTime < 300) {
          e.preventDefault();
          e.stopPropagation();
          if (scale > 1.2) {
            resetZoom();
          } else {
            scale = 2.2;
            posX = 0;
            posY = 0;
            applyTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        if (scale > 1) {
          e.stopPropagation();
          isDragging = true;
          startTouchX = touch.clientX - posX;
          startTouchY = touch.clientY - posY;
        }
      }
    }, { passive: false });

    wrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && startDistance > 0) {
        e.preventDefault();
        e.stopPropagation();
        const currentDistance = getDistance(e.touches[0], e.touches[1]);
        const nextScale = startScale * (currentDistance / startDistance);
        
        scale = Math.min(Math.max(nextScale, 0.95), 3.5);
        applyTransform(false);
      } 
      else if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        e.stopPropagation();
        const touch = e.touches[0];
        
        const maxRangeX = (window.innerWidth * (scale - 1)) / 1.5;
        const maxRangeY = (window.innerHeight * (scale - 1)) / 1.5;

        posX = Math.min(Math.max(touch.clientX - startTouchX, -maxRangeX), maxRangeX);
        posY = Math.min(Math.max(touch.clientY - startTouchY, -maxRangeY), maxRangeY);
        applyTransform(false);
      }
    }, { passive: false });

    wrapper.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        startDistance = 0;
      }
      if (e.touches.length === 0) {
        isDragging = false;
        if (scale <= 1.05) {
          resetZoom();
        }
      }
    });
  </script>
</body>
</html>
