<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우드몰 e-Catalog</title>
  <!-- Page-Flip 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 플립북이 화면 밖으로 넘치지 않도록 최대 높이/너비 강제 제한 */
    .catalog-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 80vh; /* 화면 높이의 80% 안에 쏙 들어가도록 설정 */
      max-width: 95vw;
    }

    #book {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    /* 하단 조작 바 */
    .toolbar {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #fff;
      color: #111;
    }
    .page-info {
      color: #eee;
      font-size: 0.85rem;
      min-width: 70px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 화면 크기에 맞추는 래퍼 컨테이너 -->
  <div class="catalog-wrapper">
    <div id="book"></div>
  </div>

  <!-- 컨트롤 툴바 -->
  <div class="toolbar">
    <button class="btn" id="prev-btn">이전</button>
    <span class="page-info" id="page-num">- / -</span>
    <button class="btn" id="next-btn">다음</button>
    <button class="btn" id="fullscreen-btn">전체화면</button>
  </div>

  <script>
    // ⚙️ 실제 업로드한 전체 페이지 수를 입력하세요.
    const totalPages = 16; 

    // 이미지 경로 배열 자동 생성
    const imageList = [];
    for (let i = 1; i <= totalPages; i++) {
      const formattedNum = String(i).padStart(2, '0');
      imageList.push(`pages/page-${formattedNum}.jpg`);
    }

    const book = document.getElementById('book');
    const pageNumDisplay = document.getElementById('page-num');

    // 일반 PC/노트북 화면 비율에 맞춘 PageFlip 인스턴스 생성
    const pageFlip = new St.PageFlip(book, {
      width: 480,          // 기본 페이지 너비 (A4 세로 비율)
      height: 680,         // 기본 페이지 높이
      size: 'stretch',
      minWidth: 260,
      maxWidth: 550,       // 양면 기준 최대 1100px로 제한 (모니터 오버플로우 방지)
      minHeight: 380,
      maxHeight: 780,      // 화면 세로(80vh) 안에서 조절
      maxShadowOpacity: 0.5,
      showCover: true,     // 첫/마지막 장 단면 표지 모드
      mobileScrollSupport: false
    });

    // 캔버스 방식으로 이미지들을 직접 주입 (자동 스케일링/리사이징)
    pageFlip.loadFromImages(imageList);

    // 페이지 인디케이터 업데이트
    function updatePageIndicator() {
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      pageNumDisplay.textContent = `${current} / ${total}`;
    }

    pageFlip.on('init', updatePageIndicator);
    pageFlip.on('flip', updatePageIndicator);

    // 버튼 동작
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
    
    // 전체화면 토글
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 키보드 좌우 방향키 넘김
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
    });
  </script>
</body>
</html>
