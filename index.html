<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우드몰 e-Catalog</title>
  <!-- Page-Flip 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #1a1a1a;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 플립북 래퍼: 하단 툴바 공간(80px)을 제외하고 화면 전체를 최대한 활용 */
    .catalog-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 80px);
      max-width: 96vw;
      padding-top: 10px;
    }

    #book {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    /* 하단 고정 컨트롤 툴바 */
    .toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 30, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    .page-info {
      color: #eee;
      font-size: 0.85rem;
      min-width: 65px;
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* 모바일 작은 화면 대응 */
    @media (max-width: 600px) {
      .catalog-wrapper {
        height: calc(100vh - 70px);
        max-width: 100vw;
      }
      .toolbar {
        bottom: 12px;
        padding: 6px 14px;
        gap: 8px;
      }
      .btn {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- 카탈로그 뷰어 영역 -->
  <div class="catalog-wrapper">
    <div id="book"></div>
  </div>

  <!-- 화면 최하단 고정 조작 바 -->
  <div class="toolbar">
    <button class="btn" id="prev-btn">이전</button>
    <span class="page-info" id="page-num">- / -</span>
    <button class="btn" id="next-btn">다음</button>
    <button class="btn" id="fullscreen-btn">전체화면</button>
  </div>

  <script>
    // ⚙️ [설정] 실제 업로드된 전체 페이지 수
    const totalPages = 16; 

    // 이미지 파일 경로 배열 생성
    const imageList = [];
    for (let i = 1; i <= totalPages; i++) {
      const formattedNum = String(i).padStart(2, '0');
      imageList.push(`pages/page-${formattedNum}.jpg`);
    }

    const book = document.getElementById('book');
    const pageNumDisplay = document.getElementById('page-num');

    // 화면 비율에 맞추어 시원하게 커지도록 상한선(max) 확대 설정
    const pageFlip = new St.PageFlip(book, {
      width: 550,          // 기준 너비 (A4 세로 비율)
      height: 780,         // 기준 높이
      size: 'stretch',     // 부모 영역 크기에 맞춰 유동적으로 리사이징
      minWidth: 260,
      maxWidth: 900,       // 모니터 화면에 맞게 훨씬 크게 확대 허용 (단면 기준 최대 900px)
      minHeight: 380,
      maxHeight: 1200,     // 세로 높이 최대 1200px까지 확대
      maxShadowOpacity: 0.5,
      showCover: true,     // 첫/마지막 페이지 단면 표지
      mobileScrollSupport: false
    });

    // 캔버스 방식으로 이미지 주입
    pageFlip.loadFromImages(imageList);

    // 페이지 번호 갱신
    function updatePageIndicator() {
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      pageNumDisplay.textContent = `${current} / ${total}`;
    }

    pageFlip.on('init', updatePageIndicator);
    pageFlip.on('flip', updatePageIndicator);

    // 이전/다음 버튼 이벤트
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
    
    // 전체화면 토글
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 키보드 방향키 이동 지원
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
    });
  </script>
</body>
</html>
