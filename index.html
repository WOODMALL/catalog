<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우드몰 e-Catalog</title>
  <!-- Page-Flip 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #1a1a1a;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 뷰어를 화면 정중앙에 배치 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 플립북 래퍼: 전체 화면 높이의 67% 크기로 제한 */
    .catalog-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 67vh; /* 67% 비율 적용 */
      max-width: 88vw;
      margin-bottom: 30px; /* 하단 툴바와 겹치지 않도록 여백 확보 */
    }

    #book {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    /* 화면 최하단 고정 조작 바 */
    .toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 30, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    .page-info {
      color: #eee;
      font-size: 0.85rem;
      min-width: 65px;
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* 모바일 작은 화면 대응 */
    @media (max-width: 600px) {
      .catalog-wrapper {
        height: 60vh;
        max-width: 95vw;
        margin-bottom: 40px;
      }
      .toolbar {
        bottom: 12px;
        padding: 6px 14px;
        gap: 8px;
      }
      .btn {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- 67% 크기로 조절된 카탈로그 뷰어 -->
  <div class="catalog-wrapper">
    <div id="book"></div>
  </div>

  <!-- 화면 최하단 고정 조작 바 -->
  <div class="toolbar">
    <button class="btn" id="prev-btn">이전</button>
    <span class="page-info" id="page-num">- / -</span>
    <button class="btn" id="next-btn">다음</button>
    <button class="btn" id="fullscreen-btn">전체화면</button>
  </div>

  <script>
    // ⚙️ [설정] 실제 업로드된 전체 페이지 수
    const totalPages = 16; 

    // 이미지 경로 배열 생성
    const imageList = [];
    for (let i = 1; i <= totalPages; i++) {
      const formattedNum = String(i).padStart(2, '0');
      imageList.push(`pages/page-${formattedNum}.jpg`);
    }

    const book = document.getElementById('book');
    const pageNumDisplay = document.getElementById('page-num');

    // 기존 대비 약 67% 비율로 축소 조정한 PageFlip 설정
    const pageFlip = new St.PageFlip(book, {
      width: 370,          // 기준 너비 (550 * 0.67)
      height: 520,         // 기준 높이 (780 * 0.67)
      size: 'stretch',
      minWidth: 200,
      maxWidth: 600,       // 단면 기준 최대 너비 (900 * 0.67)
      minHeight: 280,
      maxHeight: 800,      // 최대 높이 (1200 * 0.67)
      maxShadowOpacity: 0.5,
      showCover: true,     // 첫/마지막 장 표지 단면 모드
      mobileScrollSupport: false
    });

    // 캔버스 방식으로 이미지 주입
    pageFlip.loadFromImages(imageList);

    // 페이지 인디케이터 업데이트
    function updatePageIndicator() {
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      pageNumDisplay.textContent = `${current} / ${total}`;
    }

    pageFlip.on('init', updatePageIndicator);
    pageFlip.on('flip', updatePageIndicator);

    // 이전/다음 버튼 이벤트
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
    
    // 전체화면 토글
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 키보드 좌우 방향키 탐색
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
    });
  </script>
</body>
</html>
